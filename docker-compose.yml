# Hogar de los Alpes — Entrega 4
#
# Cuatro microservicios, cada uno con su propia base de datos, sobre un clúster
# de Apache Pulsar. `docker compose up` desde un clon limpio levanta el sistema
# completo.
#
# Clúster de Pulsar: ZooKeeper (metadatos) · 2 bookies (el log durable) ·
# 2 brokers. Los quórums ensemble=2 / write=2 / ack=2 hacen que cada entrada del
# log quede en los DOS bookies antes de confirmarle al productor: eso es la
# durabilidad sobre la que se apoya el escenario 6, no una palabra en una lámina.
#
# Listeners: dentro de la red de Docker los servicios hablan con broker-1:6650 y
# broker-2:6650 (listener `internal`). Desde el host, las herramientas usan
# pulsar://localhost:6650,localhost:6651 con listener_name="external". Sin esa
# distinción, el broker le devolvería a un cliente del host una dirección
# (broker-2) que no puede resolver.
#
# Topología de datos DESCENTRALIZADA (INF-5 · CA-T1): cada servicio comparte red
# con el broker y con SU base de datos. Desde `gestion-trabajos`, el host
# `postgres-acreditacion` ni siquiera resuelve. No es disciplina: es la red.
# Única adición: la API de cada servicio comparte además una red `red-bff-<svc>`
# con el BFF y con nadie más (excepción al Principio I, en docs/decisiones.md).
#
# BFF (US-02): componente de borde, sin base de datos ni broker. Es el único que
# llama por HTTP hacia adentro; los servicios de dominio siguen sin llamarse.
#
# Puertos de las API en el host: 8000 trabajos · 8001 operaciones ·
# 8002 acreditación · 8003 emparejamiento · 8090 BFF (el 8080 es del broker).

services:
  # --------------------------------------------------------------- Pulsar
  zookeeper:
    image: apachepulsar/pulsar:3.2.2
    container_name: hda-zookeeper
    restart: on-failure
    networks: [red-broker]
    volumes:
      - zkdata:/pulsar/data
    environment:
      metadataStoreUrl: zk:zookeeper:2181
      PULSAR_MEM: -Xms256m -Xmx512m
    command: >
      bash -c "bin/apply-config-from-env.py conf/zookeeper.conf &&
               bin/generate-zookeeper-config.sh conf/zookeeper.conf &&
               exec bin/pulsar zookeeper"
    healthcheck:
      test: ["CMD", "bin/pulsar-zookeeper-ruok.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Una sola ejecución: registra el clúster en los metadatos. Si ya existe, no
  # falla el arranque.
  pulsar-init:
    image: apachepulsar/pulsar:3.2.2
    container_name: hda-pulsar-init
    networks: [red-broker]
    depends_on:
      zookeeper:
        condition: service_healthy
    # En una sola línea a propósito: con `>` de YAML, las líneas más indentadas
    # conservan el salto y bash tomaría cada `--bandera` como una orden suelta.
    # Las banderas son las de Pulsar 3.x: `--zookeeper` y `--configuration-store`
    # ya no existen.
    command: >
      bash -c "bin/pulsar initialize-cluster-metadata --cluster cluster-hda --metadata-store zk:zookeeper:2181 --configuration-metadata-store zk:zookeeper:2181 --web-service-url http://broker-1:8080 --broker-service-url pulsar://broker-1:6650 || echo 'metadatos ya inicializados'"

  bookie-1: &bookie
    image: apachepulsar/pulsar:3.2.2
    container_name: hda-bookie-1
    restart: on-failure
    networks: [red-broker]
    volumes:
      - bookie1data:/pulsar/data
    environment: &bookie-env
      clusterName: cluster-hda
      zkServers: zookeeper:2181
      metadataServiceUri: metadata-store:zk:zookeeper:2181
      advertisedAddress: bookie-1
      # En Docker Desktop el volumen suele ir lleno; con el umbral por defecto el
      # bookie pasaría a solo-lectura y el escenario 6 fallaría por una causa que
      # no tiene nada que ver con la arquitectura.
      diskUsageThreshold: "0.99"
      diskUsageWarnThreshold: "0.99"
      BOOKIE_MEM: -Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m
    depends_on:
      zookeeper:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    command: >
      bash -c "bin/apply-config-from-env.py conf/bookkeeper.conf &&
               exec bin/pulsar bookie"

  bookie-2:
    <<: *bookie
    container_name: hda-bookie-2
    volumes:
      - bookie2data:/pulsar/data
    environment:
      <<: *bookie-env
      advertisedAddress: bookie-2

  broker-1: &broker
    image: apachepulsar/pulsar:3.2.2
    container_name: hda-broker-1
    restart: on-failure
    networks: [red-broker]
    ports:
      - "6650:6650"
      - "8080:8080"
    environment: &broker-env
      clusterName: cluster-hda
      zookeeperServers: zookeeper:2181
      metadataStoreUrl: zk:zookeeper:2181
      configurationMetadataStoreUrl: zk:zookeeper:2181
      advertisedAddress: broker-1
      internalListenerName: internal
      advertisedListeners: internal:pulsar://broker-1:6650,external:pulsar://localhost:6650
      # Cada entrada del log, en los dos bookies antes de confirmar (escenario 6)
      managedLedgerDefaultEnsembleSize: "2"
      managedLedgerDefaultWriteQuorum: "2"
      managedLedgerDefaultAckQuorum: "2"
      # Los tópicos los crea el script de INF-3, no un nombre mal escrito
      allowAutoTopicCreation: "false"
      brokerDeleteInactiveTopicsEnabled: "false"
      PULSAR_MEM: -Xms512m -Xmx1g -XX:MaxDirectMemorySize=512m
    depends_on:
      zookeeper:
        condition: service_healthy
      bookie-1:
        condition: service_started
      bookie-2:
        condition: service_started
    command: >
      bash -c "bin/apply-config-from-env.py conf/broker.conf &&
               exec bin/pulsar broker"
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  broker-2:
    <<: *broker
    container_name: hda-broker-2
    ports:
      - "6651:6650"
      - "8081:8080"
    environment:
      <<: *broker-env
      advertisedAddress: broker-2
      advertisedListeners: internal:pulsar://broker-2:6650,external:pulsar://localhost:6651

  # Una sola ejecución: crea tenant, namespaces, políticas, tópicos
  # particionados y las suscripciones por adelantado. Idempotente.
  pulsar-config:
    image: apachepulsar/pulsar:3.2.2
    container_name: hda-pulsar-config
    networks: [red-broker]
    depends_on:
      broker-1:
        condition: service_healthy
    volumes:
      - ./infra/pulsar:/infra:ro
    environment:
      PULSAR_ADMIN_URL: http://broker-1:8080
    command: bash /infra/inicializar.sh

  # Panel visual de tópicos/suscripciones/backlog — solo para demostrar en
  # vivo (sustentación, escenarios 6 y 8): NO forma parte del sistema en
  # producción, por eso va detrás de un profile y `docker compose up -d` sin
  # más no lo levanta. Arranque:
  #   docker compose --profile demo up -d pulsar-manager
  # Primer uso (una sola vez): infra/pulsar/pulsar-manager-setup.sh, luego
  # entrar a http://localhost:9527 (o al puerto publicado en AWS) con las
  # credenciales que imprime el script y agregar un entorno apuntando a
  # http://broker-1:8080 (ver infra/pulsar/README.md).
  pulsar-manager:
    image: apachepulsar/pulsar-manager:v0.4.0
    container_name: hda-pulsar-manager
    profiles: [demo]
    networks: [red-broker]
    ports:
      - "9527:9527"   # UI
      - "7750:7750"   # API del backend — la usa pulsar-manager-setup.sh
    depends_on:
      broker-1:
        condition: service_healthy
    environment:
      SPRING_CONFIGURATION_FILE: /pulsar-manager/pulsar-manager/application.properties

  # Gráficas para la demo — mismo profile e idea que pulsar-manager, pero con
  # series de tiempo (throughput, backlog) en vez de una tabla estática.
  # Prometheus scrapea el /metrics que el broker y los bookies ya exponen de
  # fábrica (infra/pulsar/prometheus.yml): no hay exporter que instalar.
  #   docker compose --profile demo up -d prometheus grafana
  #   http://localhost:3000  (usuario admin, clave GRAFANA_PASSWORD o "hogaralpes")
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hda-prometheus
    profiles: [demo]
    networks: [red-broker]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/pulsar/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      broker-1:
        condition: service_healthy

  # El dashboard de infra/pulsar/grafana/dashboards/pulsar.json y el
  # datasource de Prometheus se cargan solos por provisioning — no hay UI que
  # configurar a mano, a diferencia de Pulsar Manager.
  grafana:
    image: grafana/grafana:11.1.0
    container_name: hda-grafana
    profiles: [demo]
    networks: [red-broker]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-hogaralpes}
    volumes:
      - ./infra/pulsar/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/pulsar/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ------------------------------------------------- 1 · Gestión de Trabajos
  postgres-trabajos: &postgres
    image: postgres:16-alpine
    networks: [red-trabajos]
    environment: &pg-env
      POSTGRES_USER: ${POSTGRES_USER:-hogaralpes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hogaralpes}
      POSTGRES_DB: gestion_trabajos
    volumes:
      - pgdata-trabajos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hogaralpes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Una imagen, dos procesos: la API y el consumidor escalan por separado.
  gestion-trabajos:
    build: ./servicios/gestion_trabajos
    networks: [red-broker, red-trabajos, red-bff-trabajos]
    environment: &gt-env
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-hogaralpes}:${POSTGRES_PASSWORD:-hogaralpes}@postgres-trabajos:5432/gestion_trabajos
      BROKER_HOST: broker-1
      SERVICIO: gestion-trabajos
      MODO: api
      # MOD-1 (CA-M1, escenarios/mod-1.sh): postgres (por defecto) | memoria.
      ADAPTADOR_TRABAJOS: ${ADAPTADOR_TRABAJOS:-postgres}
      # El adaptador en memoria es POR PROCESO (§ "Un diccionario por
      # instancia" de repositorios_memoria.py): con más de un worker de
      # gunicorn, un POST y el GET que lo verifica pueden caer en procesos
      # distintos. mod-1.sh fuerza WORKERS=1 mientras dura la demostración.
      WORKERS: ${WORKERS:-2}
      # Escenario 2 (MOD-2): el sidecar lee de un volumen, no de la imagen —
      # "agregar un país" es editar infra/sidecar/reglas_regionales.json y
      # reiniciar el proceso, sin reconstruir nada (ver infra/sidecar/README.md).
      RUTA_REGLAS_REGIONALES: /app/config/reglas_regionales.json
    volumes:
      - ./infra/sidecar/reglas_regionales.json:/app/config/reglas_regionales.json:ro
    ports:
      # 5000 lo ocupa AirPlay Receiver en macOS; el host usa 8000 por defecto.
      - "${PUERTO_TRABAJOS:-8000}:5000"
    depends_on:
      postgres-trabajos:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  # Sin puertos publicados: por eso se puede escalar con
  # `docker compose up -d --scale gestion-trabajos-consumidor=4` (escenario 8),
  # y detenerlo sin tumbar la API (escenario 6).
  gestion-trabajos-consumidor:
    build: ./servicios/gestion_trabajos
    networks: [red-broker, red-trabajos]
    environment:
      <<: *gt-env
      MODO: consumidor
    volumes:
      - ./infra/sidecar/reglas_regionales.json:/app/config/reglas_regionales.json:ro
    depends_on:
      postgres-trabajos:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  # ------------------------------------------------------- 2 · Operaciones
  postgres-operaciones:
    <<: *postgres
    networks: [red-operaciones]
    environment:
      <<: *pg-env
      POSTGRES_DB: operaciones
    volumes:
      - pgdata-operaciones:/var/lib/postgresql/data

  operaciones:
    build: ./servicios/operaciones
    networks: [red-broker, red-operaciones, red-bff-operaciones]
    environment: &ops-env
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-hogaralpes}:${POSTGRES_PASSWORD:-hogaralpes}@postgres-operaciones:5432/operaciones
      BROKER_HOST: broker-1
      SERVICIO: operaciones
      MODO: api
    ports:
      - "${PUERTO_OPERACIONES:-8001}:5000"
    depends_on:
      postgres-operaciones:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  # El reactor del escenario 6: se detiene con `docker compose stop
  # operaciones-consumidor` y la API de Operaciones sigue respondiendo.
  operaciones-consumidor:
    build: ./servicios/operaciones
    networks: [red-broker, red-operaciones]
    environment:
      <<: *ops-env
      MODO: consumidor
    depends_on:
      postgres-operaciones:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  # ------------------------------------------------------ 3 · Acreditación
  postgres-acreditacion:
    <<: *postgres
    networks: [red-acreditacion]
    environment:
      <<: *pg-env
      POSTGRES_DB: acreditacion
    volumes:
      - pgdata-acreditacion:/var/lib/postgresql/data

  acreditacion:
    build: ./servicios/acreditacion
    networks: [red-broker, red-acreditacion, red-bff-acreditacion]
    environment: &acr-env
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-hogaralpes}:${POSTGRES_PASSWORD:-hogaralpes}@postgres-acreditacion:5432/acreditacion
      BROKER_HOST: broker-1
      SERVICIO: acreditacion
      MODO: api
    ports:
      - "${PUERTO_ACREDITACION:-8002}:5000"
    depends_on:
      postgres-acreditacion:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  acreditacion-consumidor:
    build: ./servicios/acreditacion
    networks: [red-broker, red-acreditacion]
    environment:
      <<: *acr-env
      MODO: consumidor
    depends_on:
      postgres-acreditacion:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  # ----------------------------------------------------- 4 · Emparejamiento
  postgres-emparejamiento:
    <<: *postgres
    networks: [red-emparejamiento]
    environment:
      <<: *pg-env
      POSTGRES_DB: emparejamiento
    volumes:
      - pgdata-emparejamiento:/var/lib/postgresql/data

  emparejamiento:
    build: ./servicios/emparejamiento
    networks: [red-broker, red-emparejamiento, red-bff-emparejamiento]
    environment: &emp-env
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-hogaralpes}:${POSTGRES_PASSWORD:-hogaralpes}@postgres-emparejamiento:5432/emparejamiento
      BROKER_HOST: broker-1
      SERVICIO: emparejamiento
      MODO: api
      REGION: andina
    ports:
      - "${PUERTO_EMPAREJAMIENTO:-8003}:5000"
    depends_on:
      postgres-emparejamiento:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  # La proyección de proveedores: una sola réplica, consume `evt-acreditacion`.
  # Separada de los consumidores regionales para que escalar el escenario 8 no
  # arrastre réplicas ociosas de la proyección.
  emparejamiento-proyeccion:
    build: ./servicios/emparejamiento
    networks: [red-broker, red-emparejamiento]
    environment:
      <<: *emp-env
      MODO: consumidor
      ROL_CONSUMIDOR: proyeccion
    depends_on:
      postgres-emparejamiento:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  # Una réplica por región: es la unidad de despliegue del escenario 8.
  # Escalar una región: `docker compose up -d --scale emparejamiento-andina=4`.
  emparejamiento-andina: &emp-regional
    build: ./servicios/emparejamiento
    networks: [red-broker, red-emparejamiento]
    environment:
      <<: *emp-env
      MODO: consumidor
      ROL_CONSUMIDOR: regional
      REGION: andina
    depends_on:
      postgres-emparejamiento:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  emparejamiento-norteamerica:
    <<: *emp-regional
    environment:
      <<: *emp-env
      MODO: consumidor
      ROL_CONSUMIDOR: regional
      REGION: norteamerica

  # Cono Sur NO arranca por defecto: se agrega EN CALIENTE durante el escenario 8
  # para medir que las regiones activas no se interrumpen (CA-8.4).
  #
  #   bash infra/pulsar/agregar-region.sh conosur
  #   docker compose --profile conosur up -d emparejamiento-conosur
  emparejamiento-conosur:
    <<: *emp-regional
    profiles: [conosur]
    environment:
      <<: *emp-env
      MODO: consumidor
      ROL_CONSUMIDOR: regional
      REGION: conosur

  # ------------------------------------------------------------- 5 · saga_log
  # Entrega 5: servicio nuevo, solo observador (CA-1.16, D9 de
  # specs/002-saga-asignacion-trabajo/research.md). Nace de la misma plantilla
  # que los otros cuatro; no publica nada, así que no tiene productor propio.
  postgres-saga:
    <<: *postgres
    networks: [red-saga]
    environment:
      <<: *pg-env
      POSTGRES_DB: saga_log
    volumes:
      - pgdata-saga:/var/lib/postgresql/data

  saga-log:
    build: ./servicios/saga_log
    networks: [red-broker, red-saga, red-bff-saga]
    environment: &saga-env
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-hogaralpes}:${POSTGRES_PASSWORD:-hogaralpes}@postgres-saga:5432/saga_log
      BROKER_HOST: broker-1
      SERVICIO: saga_log
      MODO: api
    ports:
      - "${PUERTO_SAGA:-8004}:5000"
    depends_on:
      postgres-saga:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  saga-log-consumidor:
    build: ./servicios/saga_log
    networks: [red-broker, red-saga]
    environment:
      <<: *saga-env
      MODO: consumidor
    depends_on:
      postgres-saga:
        condition: service_healthy
      broker-1:
        condition: service_healthy

  # ------------------------------------------------------------------ BFF
  # Un solo punto de entrada para los clientes (US-02). Sin base de datos, sin
  # broker, sin volúmenes y SIN `depends_on`: debe arrancar aunque un servicio
  # de atrás esté caído (o todavía no exista, como `saga-log`) y degradar.
  # Solo está en las redes `red-bff-*`: no resuelve el broker ni las bases.
  bff:
    build: ./servicios/bff
    networks:
      - red-bff-trabajos
      - red-bff-operaciones
      - red-bff-acreditacion
      - red-bff-emparejamiento
      - red-bff-saga
    environment:
      URL_TRABAJOS: http://gestion-trabajos:5000
      URL_OPERACIONES: http://operaciones:5000
      URL_ACREDITACION: http://acreditacion:5000
      URL_EMPAREJAMIENTO: http://emparejamiento:5000
      URL_SAGAS: http://saga-log:5000
      TIMEOUT_REENVIO_S: ${TIMEOUT_REENVIO_S:-5}
      TIMEOUT_COMPUESTO_S: ${TIMEOUT_COMPUESTO_S:-1.5}
      WORKERS: ${WORKERS:-2}
      THREADS: ${THREADS:-8}
    ports:
      # 8080 lo publica broker-1.
      - "${PUERTO_BFF:-8090}:5000"

networks:
  red-broker:
  red-trabajos:
  red-operaciones:
  red-acreditacion:
  red-emparejamiento:
  red-saga:
  # Una red por par BFF–servicio: cada una tiene solo al BFF y a una API.
  red-bff-trabajos:
  red-bff-operaciones:
  red-bff-acreditacion:
  red-bff-emparejamiento:
  red-bff-saga:

volumes:
  pgdata-trabajos:
  pgdata-operaciones:
  pgdata-acreditacion:
  pgdata-emparejamiento:
  pgdata-saga:
  zkdata:
  bookie1data:
  bookie2data:
