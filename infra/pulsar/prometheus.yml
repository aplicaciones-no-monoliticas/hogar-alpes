# Scrape config para la demo (--profile demo). Apunta al endpoint Prometheus
# que Pulsar expone de fábrica en cada broker/bookie — no hay que instalar
# ningún exporter aparte.
#
#   broker  :8080/metrics — throughput, backlog y conteos por tópico/suscripción
#   bookie  :8000/metrics — uso de disco y estado del ledger (relevante para
#                            el escenario 6: ahí se ve venir un bookie lleno)
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: pulsar-broker
    static_configs:
      - targets: [broker-1:8080, broker-2:8080]
        labels: {}

  - job_name: pulsar-bookie
    static_configs:
      - targets: [bookie-1:8000, bookie-2:8000]
