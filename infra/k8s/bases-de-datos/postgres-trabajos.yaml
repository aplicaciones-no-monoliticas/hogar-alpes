apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-trabajos
  labels: { app: postgres-trabajos, tier: db }
spec:
  serviceName: postgres-trabajos
  replicas: 1
  selector:
    matchLabels: { app: postgres-trabajos }
  template:
    metadata:
      labels: { app: postgres-trabajos, tier: db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-trabajos-credenciales, key: usuario } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-trabajos-credenciales, key: password } }
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_DB
              value: "gestion_trabajos"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "$(POSTGRES_USER)"] }
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "$(POSTGRES_USER)"] }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-trabajos
  labels: { app: postgres-trabajos }
spec:
  clusterIP: None
  selector: { app: postgres-trabajos }
  ports:
    - port: 5432
      name: postgres
