# Excepción por base: solo los pods del servicio dueño (label "servicio")
# pueden conectarse a su propia base — igual que la red Docker dedicada de
# cada servicio en docker-compose.yml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gestion-trabajos-to-db
spec:
  podSelector: { matchLabels: { app: postgres-trabajos } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { servicio: gestion-trabajos } }
      ports: [{ protocol: TCP, port: 5432 }]
---
