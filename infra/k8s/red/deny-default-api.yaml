# Default-deny de ingreso para las seis API de dominio: por defecto, ningún
# pod las alcanza. La única excepción es el BFF (allow-bff.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-default-gestion-trabajos-api
spec:
  podSelector: { matchLabels: { app: gestion-trabajos-api } }
  policyTypes: ["Ingress"]
  ingress: []
---
