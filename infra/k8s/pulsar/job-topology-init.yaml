# Reutiliza infra/pulsar/inicializar.sh y comun.sh TAL CUAL (no se reescriben,
# research.md Decisión 5) para crear tenant, namespaces, tópicos particionados
# y las suscripciones por adelantado. Corre una sola vez, después de que los
# brokers estén sanos — infra/k8s/desplegar.sh espera su Job antes de seguir.
# Los scripts llegan al contenedor por un ConfigMap (ver kustomization.yaml),
# no reconstruyendo ninguna imagen.
apiVersion: batch/v1
kind: Job
metadata:
  name: pulsar-topology-init
  labels: { app: pulsar-topology-init, tier: pulsar }
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app: pulsar-topology-init }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: inicializar
          image: apachepulsar/pulsar:3.2.2
          command: ["bash", "/infra/inicializar.sh"]
          env:
            - name: PULSAR_ADMIN_URL
              value: "http://broker:8080"
          volumeMounts:
            - name: pulsar-scripts
              mountPath: /infra
              readOnly: true
      volumes:
        - name: pulsar-scripts
          configMap:
            name: pulsar-scripts
            defaultMode: 0755
